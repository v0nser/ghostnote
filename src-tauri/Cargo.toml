[package]
name = "coda"
version = "0.1.0"
description = "Coda: Your work, resolved. Your mind, at peace."
authors = ["Coda"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix keeps the library name from colliding with the binary name
# on Windows, and lets integration tests link against the crate.
[lib]
name = "coda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pdf-extract = "0.7"

# Audio capture and preprocessing.
cpal = "0.17"
hound = "3.5"
tauri-plugin-global-shortcut = "2" # OS hotkey for screen-ask
xcap = "0.9.8" # focused-window / screen bitmap, no extra sidecar
image = { version = "0.25.6", default-features = false, features = ["jpeg"] }
base64 = "0.22"
tauri-plugin-autostart = "2" # LaunchAgent / Run key, not LaunchDaemon
tauri-plugin-notification = "2" # overdue and pending-approval OS alerts
notify = "8" # folder events for suggestion queue

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# System-audio capture. cpal cannot capture output on macOS, so participant
# audio comes from ScreenCaptureKit instead.
screencapturekit = "9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
